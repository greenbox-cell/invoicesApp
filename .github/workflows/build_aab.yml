name: Build AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-aab:
    name: Build release App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Configure Play upload signing
        env:
          GH_TOKEN: ${{ github.token }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PLAY_SHA1="0FDFFCAF289C06675125EE93B4B2F1A4BB889023"
          PLAY_SHA1_COLONS="0F:DF:FC:AF:28:9C:06:67:51:25:EE:93:B4:B2:F1:A4:BB:88:90:23"

          sha1_of() {
            keytool -list -v -keystore "$1" -storepass "$2" -alias "$3" 2>/dev/null \
              | grep -i "SHA1:" \
              | head -n 1 \
              | sed -E 's/.*SHA1:\s*//I' \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]' \
              | tr -d ':'
          }

          write_props() {
            {
              echo "storeFile=$1"
              echo "storePassword=$2"
              echo "keyAlias=$3"
              echo "keyPassword=$4"
            } > keystore.properties
          }

          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > upload-keystore.jks
            ALIAS="${KEY_ALIAS:-upload}"
            KEYPASS="${KEY_PASSWORD:-${KEYSTORE_PASSWORD}}"
            ACTUAL=$(sha1_of upload-keystore.jks "${KEYSTORE_PASSWORD}" "${ALIAS}")
            if [ "${ACTUAL}" = "${PLAY_SHA1}" ]; then
              write_props upload-keystore.jks "${KEYSTORE_PASSWORD}" "${ALIAS}" "${KEYPASS}"
              echo "Using GitHub secrets keystore (SHA1 matches Play)."
              echo "SHA1 ${PLAY_SHA1_COLONS}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Secrets keystore SHA1 ${ACTUAL} does not match Play. Trying original CI artifacts..."
          fi

          download_artifact() {
            local id="$1"
            local dest="$2"
            curl -sS -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -o "${dest}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip"
            unzip -o -q "${dest}" -d "${dest%.zip}"
          }

          # First successful CI keystore, then the later generated one.
          download_artifact 10344321113 first-ks.zip || true
          download_artifact 10344611500 second-ks.zip || true

          find first-ks second-ks -iname '*.jks' -o -iname '*.keystore' > ks-candidates.txt || true
          cat ks-candidates.txt

          MATCH=""
          while IFS= read -r ks; do
            [ -f "$ks" ] || continue
            for pass in invoicesci mp1234upload android; do
              actual=$(sha1_of "$ks" "$pass" upload || true)
              echo "Candidate $ks pass=$pass SHA1=$actual"
              if [ "$actual" = "$PLAY_SHA1" ]; then
                MATCH="$ks"
                MATCH_PASS="$pass"
                break 2
              fi
            done
          done < ks-candidates.txt

          if [ -z "${MATCH}" ]; then
            echo "::error::Could not find a keystore with Play SHA1 ${PLAY_SHA1_COLONS}."
            echo "Do not upload an AAB signed with a different key."
            exit 1
          fi

          cp "$MATCH" play-upload-keystore.jks
          write_props play-upload-keystore.jks "$MATCH_PASS" upload "$MATCH_PASS"
          echo "Using $MATCH (password matched). SHA1 ${PLAY_SHA1_COLONS}"
          echo "Signed with Play upload key ${PLAY_SHA1_COLONS}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify package name and provider authorities
        run: |
          set -euo pipefail
          if grep -R "com.invoices.app" app/build --include="AndroidManifest.xml"; then
            echo "::error::Build still contains com.invoices.app — Play will reject the AAB."
            exit 1
          fi
          if ! grep -R "com.mealplanner1234.app" app/build --include="AndroidManifest.xml" >/dev/null; then
            echo "::error::Merged manifest is missing com.mealplanner1234.app"
            exit 1
          fi
          echo "Package com.mealplanner1234.app is present; com.invoices.app is not."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoices-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
