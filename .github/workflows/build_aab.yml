name: Build AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    name: Build release App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=${KEYSTORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS:-upload}"
              echo "keyPassword=${KEY_PASSWORD:-${KEYSTORE_PASSWORD}}"
            } > keystore.properties
            echo "generated_keystore=false" >> "$GITHUB_OUTPUT"
            echo "Using KEYSTORE_BASE64 secret for signing."
          else
            keytool -genkeypair \
              -keystore ci-upload-keystore.jks \
              -storepass invoicesci \
              -keypass invoicesci \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Invoices, OU=Mobile, O=Invoices, L=Local, ST=NA, C=IL" \
              -noprompt
            {
              echo "storeFile=ci-upload-keystore.jks"
              echo "storePassword=invoicesci"
              echo "keyAlias=upload"
              echo "keyPassword=invoicesci"
            } > keystore.properties
            echo "generated_keystore=true" >> "$GITHUB_OUTPUT"
            echo "No signing secrets found. Generated a CI keystore for this run."
          fi

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoices-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated CI keystore
        if: steps.signing.outputs.generated_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: invoices-ci-upload-keystore
          path: ci-upload-keystore.jks
          if-no-files-found: error
          retention-days: 14
