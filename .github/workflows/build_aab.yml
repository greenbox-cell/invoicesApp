name: Build AAB

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    name: Build release App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          PLAY_SHA1="0F:DF:FC:AF:28:9C:06:67:51:25:EE:93:B4:B2:F1:A4:BB:88:90:23"

          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ]; then
            echo "${KEYSTORE_BASE64}" | base64 -d > upload-keystore.jks
            ALIAS="${KEY_ALIAS:-upload}"
            KEYPASS="${KEY_PASSWORD:-${KEYSTORE_PASSWORD}}"
            STOREPASS="${KEYSTORE_PASSWORD}"
            STOREFILE="upload-keystore.jks"
            echo "Using GitHub Actions secrets for signing."
          else
            STOREFILE="signing/upload-keystore.jks"
            STOREPASS="mp1234upload"
            KEYPASS="mp1234upload"
            ALIAS="upload"
            echo "Using committed signing/upload-keystore.jks"
          fi

          {
            echo "storeFile=${STOREFILE}"
            echo "storePassword=${STOREPASS}"
            echo "keyAlias=${ALIAS}"
            echo "keyPassword=${KEYPASS}"
          } > keystore.properties

          ACTUAL=$(
            keytool -list -v -keystore "${STOREFILE}" -storepass "${STOREPASS}" -alias "${ALIAS}" \
              | grep -i "SHA1:" \
              | head -n 1 \
              | sed -E 's/.*SHA1:\s*//I' \
              | tr -d '[:space:]' \
              | tr '[:lower:]' '[:upper:]'
          )
          PLAY_NORM=$(echo "${PLAY_SHA1}" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')
          echo "Upload certificate SHA1: ${ACTUAL}"
          echo "Play-registered SHA1:    ${PLAY_NORM}"

          {
            echo "## Signing"
            echo "AAB SHA1: \`${ACTUAL}\`"
            echo "Play expects: \`${PLAY_NORM}\`"
            if [ "${ACTUAL}" != "${PLAY_NORM}" ]; then
              echo
              echo "This AAB will be **rejected by Play** until you reset the upload key."
              echo "Play Console → App integrity → App signing → Request upload key reset"
              echo "Upload \`signing/upload_certificate.pem\` from the repo (or the workflow artifact)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify package name and provider authorities
        run: |
          set -euo pipefail
          if grep -R "com.invoices.app" app/build --include="AndroidManifest.xml"; then
            echo "::error::Build still contains com.invoices.app — Play will reject the AAB."
            exit 1
          fi
          if ! grep -R "com.mealplanner1234.app" app/build --include="AndroidManifest.xml" >/dev/null; then
            echo "::error::Merged manifest is missing com.mealplanner1234.app"
            exit 1
          fi
          echo "Package com.mealplanner1234.app is present; com.invoices.app is not."

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: invoices-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload Play upload certificate (PEM)
        uses: actions/upload-artifact@v4
        with:
          name: play-upload-certificate-pem
          path: signing/upload_certificate.pem
          if-no-files-found: error
          retention-days: 14
